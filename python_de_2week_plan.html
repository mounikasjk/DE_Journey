<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python DE — 2-Week Interview Prep</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Fraunces:opsz,wght@9..144,300;400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F7F5F0;
  --surface: #FFFFFF;
  --surface2: #F0EDE6;
  --border: #E2DDD5;
  --border2: #CCC8BE;
  --ink: #1A1815;
  --ink2: #5C5750;
  --ink3: #9C9890;
  --accent: #C84B31;
  --accent2: #2B6CB0;
  --accent3: #276749;
  --gold: #B7791F;
  --mono: 'IBM Plex Mono', monospace;
  --serif: 'Fraunces', serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--serif); min-height: 100vh; }

/* TOP BAR */
.topbar {
  background: var(--ink);
  color: #F7F5F0;
  padding: 0 2rem;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.topbar-title { font-family: var(--mono); font-size: 13px; font-weight: 600; letter-spacing: 0.04em; color: #F7F5F0; }
.topbar-title span { color: #FF8A70; }
.topbar-right { display: flex; gap: 1.5rem; align-items: center; }
.topbar-stat { font-family: var(--mono); font-size: 12px; color: #9C9890; }
.topbar-stat b { color: #F7F5F0; }
.top-progress { width: 120px; height: 3px; background: #333; border-radius: 2px; overflow: hidden; }
.top-progress-fill { height: 3px; background: #FF8A70; border-radius: 2px; transition: width 0.4s; }

/* LAYOUT */
.layout { display: flex; min-height: calc(100vh - 52px); }

/* SIDEBAR */
.sidebar {
  width: 220px;
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 1.5rem 0;
  position: sticky;
  top: 52px;
  height: calc(100vh - 52px);
  overflow-y: auto;
}
.sidebar-section { margin-bottom: 0.5rem; }
.sidebar-label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--ink3);
  padding: 0 1.25rem;
  margin-bottom: 4px;
  text-transform: uppercase;
}
.day-link {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 1.25rem;
  cursor: pointer;
  transition: background 0.1s;
  border-left: 2px solid transparent;
}
.day-link:hover { background: var(--bg); }
.day-link.active { background: var(--bg); border-left-color: var(--accent); }
.day-link.done-link { border-left-color: var(--accent3); }
.dl-num { font-family: var(--mono); font-size: 11px; color: var(--ink3); min-width: 28px; }
.dl-name { font-size: 12px; color: var(--ink2); font-family: var(--serif); font-weight: 400; line-height: 1.3; }
.day-link.active .dl-name { color: var(--ink); font-weight: 600; }
.dl-check { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--border2); margin-left: auto; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.dl-check.c { background: var(--accent3); border-color: var(--accent3); }
.dl-check.c::after { content:''; width:4px; height:7px; border:1.5px solid #fff; border-top:none; border-left:none; transform:rotate(45deg); margin-top:-1px; }

/* MAIN */
.main { flex: 1; padding: 2rem; max-width: 780px; }

/* DAY PANEL */
.day-panel { display: none; }
.day-panel.active { display: block; }

.day-hero {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 1.5rem;
  padding-bottom: 1.25rem;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
  gap: 1rem;
}
.day-badge {
  font-family: var(--mono);
  font-size: 11px;
  background: var(--ink);
  color: #F7F5F0;
  padding: 3px 10px;
  border-radius: 3px;
  display: inline-block;
  margin-bottom: 8px;
  letter-spacing: 0.04em;
}
.day-badge.w2 { background: var(--accent2); }
.day-heading { font-family: var(--serif); font-size: 22px; font-weight: 600; color: var(--ink); line-height: 1.2; }
.day-subheading { font-size: 14px; color: var(--ink2); margin-top: 6px; font-weight: 300; }
.day-mark-btn {
  padding: 8px 18px;
  border-radius: 4px;
  border: 1.5px solid var(--accent);
  background: transparent;
  color: var(--accent);
  font-family: var(--mono);
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s;
  font-weight: 600;
}
.day-mark-btn:hover { background: var(--accent); color: #fff; }
.day-mark-btn.marked { background: var(--accent3); border-color: var(--accent3); color: #fff; }

/* SECTIONS */
.section { margin-bottom: 1.75rem; }
.section-title {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink3);
  margin-bottom: 0.75rem;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-title::after { content:''; flex:1; height:1px; background:var(--border); }

/* HOUR BLOCKS */
.hour-grid { display: flex; flex-direction: column; gap: 6px; }
.hour-block {
  display: grid;
  grid-template-columns: 90px 1fr;
  gap: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 14px;
  align-items: start;
  cursor: pointer;
  transition: border-color 0.15s;
}
.hour-block:hover { border-color: var(--border2); }
.hour-block.hb-done { border-left: 3px solid var(--accent3); }
.hour-block.hb-break { background: var(--surface2); border-style: dashed; cursor: default; opacity: 0.7; }
.hb-time { font-family: var(--mono); font-size: 11px; color: var(--ink3); padding-top: 2px; }
.hb-body {}
.hb-topic { font-size: 13px; font-weight: 600; color: var(--ink); margin-bottom: 3px; font-family: var(--serif); }
.hb-desc { font-size: 12px; color: var(--ink2); line-height: 1.6; font-weight: 300; }
.hb-check { width: 16px; height: 16px; border-radius: 3px; border: 1.5px solid var(--border2); margin-left: auto; flex-shrink: 0; display:flex; align-items:center; justify-content:center; }
.hb-check.c { background: var(--accent3); border-color: var(--accent3); }
.hb-check.c::after { content:''; width:4px; height:8px; border:1.5px solid #fff; border-top:none; border-left:none; transform:rotate(45deg); margin-top:-1px; }
.hour-block { grid-template-columns: 90px 1fr 20px; }

/* PROBLEMS */
.problem-list { display: flex; flex-direction: column; gap: 5px; }
.problem-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 9px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  transition: border-color 0.15s;
}
.problem-item:hover { border-color: var(--border2); }
.problem-item.p-done { border-left: 3px solid var(--accent3); }
.p-num { font-family: var(--mono); font-size: 11px; color: var(--ink3); min-width: 26px; padding-top: 1px; }
.p-body { flex: 1; }
.p-text { font-size: 13px; color: var(--ink); line-height: 1.5; font-weight: 400; }
.p-diff { font-family: var(--mono); font-size: 10px; margin-top: 4px; display: inline-block; padding: 1px 7px; border-radius: 3px; }
.easy { background: #EAF3DE; color: #276749; }
.medium { background: #FEF3C7; color: #B7791F; }
.hard { background: #FEE2E2; color: #C84B31; }
.p-check { width: 16px; height: 16px; border-radius: 3px; border: 1.5px solid var(--border2); flex-shrink:0; margin-top:1px; display:flex; align-items:center; justify-content:center; }
.p-check.c { background: var(--accent3); border-color: var(--accent3); }
.p-check.c::after { content:''; width:4px; height:8px; border:1.5px solid #fff; border-top:none; border-left:none; transform:rotate(45deg); margin-top:-1px; }

/* RESOURCES */
.resource-grid { display: flex; flex-direction: column; gap: 5px; }
.resource-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
}
.r-type { font-family: var(--mono); font-size: 10px; padding: 2px 7px; border-radius: 3px; flex-shrink: 0; }
.r-video { background: #FEE2E2; color: var(--accent); }
.r-read  { background: #E6F1FB; color: var(--accent2); }
.r-practice { background: #EAF3DE; color: var(--accent3); }
.r-doc { background: #FEF3C7; color: var(--gold); }
.r-name { font-size: 13px; color: var(--ink); flex: 1; }
.r-link { font-family: var(--mono); font-size: 11px; color: var(--accent2); text-decoration: none; }
.r-link:hover { text-decoration: underline; }

/* TAGS */
.pill { display: inline-block; font-family: var(--mono); font-size: 10px; padding: 2px 8px; border-radius: 3px; margin-right: 5px; }
.pill-sql { background: #EAF3DE; color: var(--accent3); }
.pill-de  { background: #E6F1FB; color: var(--accent2); }
.pill-hot { background: #FEE2E2; color: var(--accent); }

/* NOTES */
.notes-box { margin-top: 1rem; }
.notes-box textarea {
  width: 100%;
  min-height: 80px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 14px;
  font-family: var(--serif);
  font-size: 13px;
  color: var(--ink);
  resize: vertical;
  outline: none;
  line-height: 1.7;
}
.notes-box textarea:focus { border-color: var(--border2); }
.notes-label { font-family: var(--mono); font-size: 11px; color: var(--ink3); margin-bottom: 6px; letter-spacing: 0.05em; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-title">Python DE · <span>2-Week Interview Prep</span> · Mounika</div>
  <div class="topbar-right">
    <div class="topbar-stat">Done: <b id="top-done">0</b>/14 days</div>
    <div class="top-progress"><div class="top-progress-fill" id="top-fill" style="width:0%"></div></div>
  </div>
</div>

<div class="layout">
<nav class="sidebar" id="sidebar"></nav>
<main class="main" id="main"></main>
</div>

<script>
const plan = [
  {

    ]
  },
  {
    day:3, week:1,

let state = {};
try { state = JSON.parse(localStorage.getItem('de2wk') || '{}'); } catch(e){}
let currentDay = 0;

function sk(day, type, idx) { return `d${day}_${type}_${idx}`; }
function dayDone(d) { return state[`day_${d}`] === true; }

function countDone() { return plan.filter((_,i) => dayDone(i)).length; }

function updateTopBar() {
  const done = countDone();
  document.getElementById('top-done').textContent = done;
  document.getElementById('top-fill').style.width = (done/14*100) + '%';
}

function save() { try { localStorage.setItem('de2wk', JSON.stringify(state)); } catch(e){} }

function renderSidebar() {
  let html = '';
  [1,2].forEach(w => {
    html += `<div class="sidebar-section"><div class="sidebar-label">Week ${w}</div>`;
    plan.filter(d => d.week === w).forEach((d, idx) => {
      const di = plan.indexOf(d);
      const done = dayDone(di);
      html += `<div class="day-link ${di===currentDay?'active':''} ${done?'done-link':''}" onclick="setDay(${di})">
        <span class="dl-num">D${d.day}</span>
        <span class="dl-name">${d.title.split('—')[0].trim()}</span>
        <div class="dl-check ${done?'c':''}"></div>
      </div>`;
    });
    html += '</div>';
  });
  document.getElementById('sidebar').innerHTML = html;
}

function renderMain() {
  document.getElementById('main').innerHTML = plan.map((d, di) => `
    <div class="day-panel ${di===currentDay?'active':''}" id="panel-${di}">
      <div class="day-hero">
        <div>
          <div class="day-badge ${d.week===2?'w2':''}">Week ${d.week} · Day ${d.day}</div>
          <div class="day-heading">${d.title}</div>
          <div class="day-subheading">${d.sub}</div>
        </div>
        <button class="day-mark-btn ${dayDone(di)?'marked':''}" onclick="markDay(${di})">
          ${dayDone(di) ? '✓ Done' : 'Mark Day Done'}
        </button>
      </div>

      <div class="section">
        <div class="section-title">Hour-by-Hour Schedule</div>
        <div class="hour-grid">
          ${d.hours.map((h,hi) => {
            const k = sk(di,'h',hi);
            const done = state[k];
            return h.brk
              ? `<div class="hour-block hb-break">
                  <div class="hb-time">${h.t}</div>
                  <div class="hb-body"><div class="hb-topic">${h.topic}</div><div class="hb-desc">${h.desc}</div></div>
                  <div></div>
                 </div>`
              : `<div class="hour-block ${done?'hb-done':''}" onclick="toggleSlot('${k}',this)">
                  <div class="hb-time">${h.t}</div>
                  <div class="hb-body"><div class="hb-topic">${h.topic}</div><div class="hb-desc">${h.desc}</div></div>
                  <div class="hb-check ${done?'c':''}"></div>
                 </div>`;
          }).join('')}
        </div>
      </div>

      <div class="section">
        <div class="section-title">Problems for Today</div>
        <div class="problem-list">
          ${d.problems.map((p,pi) => {
            const k = sk(di,'p',pi);
            const done = state[k];
            return `<div class="problem-item ${done?'p-done':''}" onclick="toggleSlot('${k}',this)">
              <div class="p-num">${String(pi+1).padStart(2,'0')}</div>
              <div class="p-body">
                <div class="p-text">${p.t}</div>
                <span class="p-diff ${p.d}">${p.d}</span>
              </div>
              <div class="p-check ${done?'c':''}"></div>
            </div>`;
          }).join('')}
        </div>
      </div>

      <div class="section">
        <div class="section-title">Resources</div>
        <div class="resource-grid">
          ${d.resources.map(r => `
            <div class="resource-item">
              <span class="r-type r-${r.type}">${r.type}</span>
              <span class="r-name">${r.name}</span>
              <a class="r-link" href="${r.url}" target="_blank">open →</a>
            </div>`).join('')}
        </div>
      </div>

      <div class="section">
        <div class="section-title">My Notes</div>
        <div class="notes-box">
          <textarea placeholder="What did you learn today? What was hard? What to revisit?" onchange="saveNote(${di}, this.value)">${state['note_'+di]||''}</textarea>
        </div>
      </div>
    </div>
  `).join('');
}

function setDay(di) {
  currentDay = di;
  document.querySelectorAll('.day-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.day-link').forEach(l => l.classList.remove('active'));
  const panel = document.getElementById('panel-'+di);
  if(panel) panel.classList.add('active');
  renderSidebar();
  window.scrollTo(0,0);
}

function toggleSlot(k, el) {
  state[k] = !state[k];
  save();
  const isCheck = el.classList.contains('hour-block');
  if(isCheck) {
    el.classList.toggle('hb-done', state[k]);
    el.querySelector('.hb-check').classList.toggle('c', state[k]);
  } else {
    el.classList.toggle('p-done', state[k]);
    el.querySelector('.p-check').classList.toggle('c', state[k]);
  }
}

function markDay(di) {
  state['day_'+di] = !state['day_'+di];
  save();
  updateTopBar();
  renderSidebar();
  const btn = document.querySelector(`#panel-${di} .day-mark-btn`);
  if(btn) { btn.classList.toggle('marked', state['day_'+di]); btn.textContent = state['day_'+di] ? '✓ Done' : 'Mark Day Done'; }
}

function saveNote(di, val) { state['note_'+di] = val; save(); }

renderSidebar();
renderMain();
updateTopBar();
</script>
</body>
</html>
